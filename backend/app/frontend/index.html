<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>National Certificate Verification</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            padding: 40px;
            width: 400px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 10px;
            margin-top: 15px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #2d6cdf;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Certificate Verification</h2>
    <p>Enter your certificate ID</p>

    <input type="text" placeholder="e.g. CERT-12345">
    <br>
    <button>Verify</button>
</div>

</body>
</html>
